<!doctype html>
<html>

<head>
    <meta charset="utf-8" />
    <title>RuView - Local CSI Simulator</title>
    <style>
        body {
            font-family: Segoe UI, Arial;
            background: #121212;
            color: #e6e6e6;
            padding: 24px
        }
    </style>
</head>

<body>
    <h1>RuView Local CSI Simulator</h1>
    <p>UDP frames are broadcast to <strong>127.0.0.1:5000</strong> at ~25 FPS.</p>
    <p>Open your local receiver to ingest simulated CSI frames.</p>
    <p>Status: <span id="status">...</span></p>
    <script>
        async function status() {
            try {
                const r = await fetch('/status');
                const j = await r.json();
                document.getElementById('status').textContent = j.status + ' @' + j.fps + 'fps';
            } catch (e) { document.getElementById('status').textContent = 'offline' }
        }
        status(); setInterval(status, 2000);
    </script>
</body>

</html>
